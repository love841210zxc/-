<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>領取登記</title>
<style>
  :root{--bg:#f4f5f7;--card:#fff;--text:#1f2430;--sub:#6b7280;--main:#2563eb;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--line:#e5e7eb}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:var(--text);padding:0 12px 24px}
  header{position:sticky;top:0;margin:0 -12px;background:var(--main);color:#fff;padding:14px 16px;font-weight:700;font-size:18px;z-index:5;display:flex;justify-content:space-between;align-items:center}
  header button{background:rgba(255,255,255,.2);color:#fff;border:0;border-radius:8px;padding:6px 12px;font-size:14px}
  .stats{display:flex;gap:8px;margin-top:12px}.stat{flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center;font-size:13px;color:var(--sub)}
  .stat b{display:block;font-size:24px;color:var(--text)}
  .tabs{display:flex;margin:12px 0 8px;background:#e5e7eb;border-radius:10px;padding:3px}
  .tabs button{flex:1;border:0;background:none;padding:9px;border-radius:8px;font-size:15px}
  .tabs button.active{background:#fff;font-weight:700}
  input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px}
  .item{background:#fff;border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .item small{color:var(--sub);display:block;margin-top:2px}
  .item button{border:0;background:var(--ok);color:#fff;border-radius:8px;padding:10px 16px;font-size:16px;font-weight:700;flex-shrink:0}
  .item button.u{background:#fff;border:1px solid #9ca3af;color:#6b7280;font-size:14px;font-weight:400;padding:8px 12px}
  .item.busy{opacity:.55}
  .muted{color:var(--sub);text-align:center;padding:16px}
  .banner{padding:10px 12px;border-radius:10px;margin-top:12px;font-weight:600;background:#fee2e2;color:#991b1b}
  #toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(31,36,48,.92);color:#fff;padding:10px 18px;border-radius:20px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
  #toast.show{opacity:1}
</style>
</head>
<body>
<header><span>🎁 領取登記</span><button onclick="syncList(true)">重新整理</button></header>

<div class="stats">
  <div class="stat"><b id="sAll">-</b>總數</div>
  <div class="stat"><b id="sDone" style="color:var(--ok)">-</b>已領取</div>
  <div class="stat"><b id="sTodo" style="color:var(--warn)">-</b>未領取</div>
</div>
<div class="tabs"><button id="tTodo" class="active" onclick="setTab('todo')">未領取</button><button id="tDone" onclick="setTab('done')">已領取</button></div>
<input type="search" id="q" placeholder="搜尋編號 / ID / 姓名 / 品項" oninput="renderList()">
<div id="list"></div>
<div id="toast"></div>

<script>
// ====== 設定 ======
const API = 'https://script.google.com/macros/s/AKfycbwHbQknoLvQd9qhLUovGiwdDS9O4VL5y69qQlGqiG4tFOQy6C6nP-AIkqIi95A0xNWb/exec';
const TOKEN = 'love841210zxc'; // 與 Code.gs 相同
// ==================

let items = [], tab = 'todo', loaded = false, pending = 0;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const nowStr = () => { const d = new Date(); return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const find = code => items.find(i => i.code === code);

let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

async function api(params, body) {
  try {
    const res = body
      ? await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ token: TOKEN, ...body }) })
      : await fetch(API + '?' + new URLSearchParams({ token: TOKEN, ...params }));
    return await res.json();
  } catch (e) { return { ok: false, error: '網路連線失敗' }; }
}

// 載入 / 同步名單(有未完成的登記時不覆蓋,避免畫面跳回)
async function syncList(showLoading) {
  if (showLoading && !loaded) $('list').innerHTML = '<div class="muted">載入中…</div>';
  const r = await api({ action: 'list' });
  if (r.ok) { if (pending === 0) { items = r.items; loaded = true; renderList(); } if (showLoading) toast('已更新'); }
  else if (!loaded) $('list').innerHTML = `<div class="banner">${esc(r.error)}</div>`;
  else if (showLoading) toast(r.error);
}
setInterval(() => { if (!document.hidden) syncList(false); }, 15000);

function setTab(t) {
  tab = t;
  $('tTodo').classList.toggle('active', t === 'todo');
  $('tDone').classList.toggle('active', t === 'done');
  renderList();
}

function renderList() {
  if (!loaded) return;
  const done = items.filter(i => i.status === '已領取');
  $('sAll').textContent = items.length;
  $('sDone').textContent = done.length;
  $('sTodo').textContent = items.length - done.length;
  const kw = $('q').value.trim().toLowerCase();
  const rows = items.filter(i => (tab === 'done') === (i.status === '已領取'))
    .filter(i => !kw || [i.code, i.id, i.name, i.item].join(' ').toLowerCase().includes(kw));
  if (tab === 'done') rows.sort((a, b) => b.time.localeCompare(a.time));
  $('list').innerHTML = rows.length ? rows.map(i => `
    <div class="item">
      <div><b>${esc(i.code)}</b> ${esc(i.name)}<small>${esc(i.id)} ・ ${esc(i.item)}${i.time ? ' ・ ' + esc(i.time) : ''}</small></div>
      ${tab === 'todo'
        ? `<button onclick="act('claim','${esc(i.code)}')">領取</button>`
        : `<button class="u" onclick="act('undo','${esc(i.code)}')">取消</button>`}
    </div>`).join('') : '<div class="muted">沒有資料</div>';
}

// 按下領取:直接生效(不再跳確認),畫面先更新,背景送出;失敗會還原並提示
async function act(action, code) {
  const it = find(code); if (!it) return;
  if (action === 'undo' && !confirm('確定要取消 ' + code + ' ' + it.name + ' 的領取紀錄?')) return;
  const backup = { ...it };
  it.status = action === 'claim' ? '已領取' : '未領取';
  it.time = action === 'claim' ? nowStr() : '';
  renderList();
  toast(action === 'claim' ? `✅ ${it.name || code} 已領取` : `已取消 ${it.name || code}`);
  pending++;
  const r = await api(null, { action, code });
  pending--;
  if (r.ok || r.duplicate) {
    Object.assign(it, r.item);
    if (r.duplicate) toast('此編號已被領取過');
  } else {
    Object.assign(it, backup);
    toast('❌ 失敗:' + r.error);
  }
  renderList();
}

syncList(true);
</script>
</body>
</html>
