<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIGBANG 應援物領取系統</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QR Code 掃描套件 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 flex flex-col justify-center items-center">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden p-6">
        <h1 class="text-2xl font-bold text-center text-gray-800 mb-2">🎁 領取掃描系統</h1>
        <p class="text-center text-gray-500 text-sm mb-6">請對準 QR Code 進行掃描</p>

        <!-- QR Code 掃描器容器 -->
        <div class="mb-4 overflow-hidden rounded-lg border-2 border-dashed border-gray-300">
            <div id="reader" style="width: 100%;"></div>
        </div>

        <!-- 狀態與結果顯示 -->
        <div id="result" class="mt-4 p-4 bg-gray-50 border rounded-xl text-center text-gray-700 min-h-[90px] flex flex-col justify-center items-center">
            <span class="text-gray-400">等待掃描...</span>
        </div>
    </div>

    <script>
        // 請替換成你的 Google Apps Script 網址
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwHbQknoLvQd9qhLUovGiwdDS9O4VL5y69qQlGqiG4tFOQy6C6nP-AIkqIi95A0xNWb/exec";

        let isScanning = true;

        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanning) return;
            isScanning = false; // 暫停接收，避免連掃

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = `<span class="text-blue-600 font-bold animate-pulse">⏳ 正在查詢與記錄中...<br>代碼: ${decodedText}</span>`;

            // 傳送資料到 Google 試算表
            fetch(`${WEB_APP_URL}?code=${encodeURIComponent(decodedText)}`, {
        method: "GET"
    })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    resultDiv.innerHTML = `
                        <div class="bg-green-50 border border-green-200 p-3 rounded-lg w-full text-left">
                            <div class="text-green-700 font-bold text-lg mb-1">✅ 領取成功！</div>
                            <div class="text-sm text-gray-600">姓名：<span class="font-semibold text-gray-800">${data.name}</span></div>
                            <div class="text-sm text-gray-600">品項：<span class="font-semibold text-gray-800">${data.item}</span></div>
                            <div class="text-sm text-gray-600">時間：<span class="font-semibold text-gray-800">${data.time}</span></div>
                        </div>
                    `;
                } else if (data.status === "warning") {
                    resultDiv.innerHTML = `
                        <div class="bg-yellow-50 border border-yellow-200 p-3 rounded-lg w-full text-center">
                            <div class="text-yellow-700 font-bold">⚠️ 注意</div>
                            <div class="text-sm text-yellow-800 mt-1">${data.message}</div>
                            <div class="text-xs text-gray-500 mt-1">代碼: ${decodedText}</div>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="bg-red-50 border border-red-200 p-3 rounded-lg w-full text-center">
                            <div class="text-red-700 font-bold">❌ 失敗</div>
                            <div class="text-sm text-red-800 mt-1">${data.message}</div>
                        </div>
                    `;
                }

                // 4秒後恢復掃描
                setTimeout(() => {
                    isScanning = true;
                }, 4000);
            })
            .catch(error => {
                console.error('Error:', error);
                resultDiv.innerHTML = `<span class="text-red-600 font-bold">❌ 網路連線錯誤，請重試</span>`;
                setTimeout(() => {
                    isScanning = true;
                }, 3000);
            });
        }

        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, // 使用後置鏡頭
            { fps: 10, qrbox: { width: 220, height: 220 } },
            onScanSuccess
        ).catch(err => {
            console.error("無法啟動相機", err);
            document.getElementById('result').innerHTML = `<span class="text-red-500 text-sm">無法啟動相機，請確認是否授權相機權限，或網頁是否處於 HTTPS 環境。</span>`;
        });
    </script>
</body>
</html>
